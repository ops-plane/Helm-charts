{{- if and .Values.runner.enabled .Values.runner.networkPolicy.enabled }}
{{- $v4 := list }}{{- $v6 := list }}
{{- range .Values.runner.networkPolicy.blockedCIDRs }}
{{- if contains ":" . }}{{ $v6 = append $v6 . }}{{ else }}{{ $v4 = append $v4 . }}{{ end }}
{{- end }}
# Runner egress: DNS, the app, and anywhere outside the cluster but the blocked ranges (the cloud's instance
# metadata endpoints), so module code a job runs can't take the node's cloud identity. Ingress is
# unrestricted: runners listen on nothing.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "ops.fullname" . }}-runner
  labels:
    {{- include "ops.labels" . | nindent 4 }}
    app.kubernetes.io/component: runner
spec:
  podSelector:
    matchLabels:
      {{- include "ops.selectorLabels" (list . "runner") | nindent 6 }}
  policyTypes: [Egress]
  egress:
    # DNS to any resolver (kube-dns, NodeLocal DNSCache on 169.254.20.10, the cloud's)
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # the app (by pod: some CNIs (Cilium) don't count pods in an ipBlock)
    - to:
        - podSelector:
            matchLabels:
              {{- include "ops.selectorLabels" (list . "app") | nindent 14 }}
      ports:
        - protocol: TCP
          port: 8080
    {{- if .Values.runner.networkPolicy.allowInCluster }}
    - to:
        - namespaceSelector: {}
    {{- end }}
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            {{- with $v4 }}
            except:
              {{- toYaml . | nindent 14 }}
            {{- end }}
        - ipBlock:
            cidr: ::/0
            {{- with $v6 }}
            except:
              {{- toYaml . | nindent 14 }}
            {{- end }}
{{- end }}
